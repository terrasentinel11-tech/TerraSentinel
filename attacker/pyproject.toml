[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "black-pixel-agri-lab"
version = "3.0.0a1"
description = "Offline satellite agriculture adversarial image lab with paired GeoTIFF datasets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "rasterio>=1.3", "Pillow>=10", "cryptography>=42,<48"]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
test = ["pytest>=8"]
all = ["streamlit>=1.36", "pytest>=8", "scikit-image>=0.22"]

[project.scripts]
black-pixel = "black_pixel_agri.cli:main"
black-pixel-red-team = "red_team.cli:main"

[tool.setuptools.packages.find]
include = ["black_pixel_agri*", "red_team*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
